def shared = new Properties()
file('../gradle.properties').withInputStream { shared.load(it) }
version = shared.getProperty('mod_version')
group = 'dev.superdisc'
java.toolchain.languageVersion = JavaLanguageVersion.of(21)
repositories { mavenCentral() }
sourceSets.main.java.srcDir '../shared-1.21.1/src/main/java'
sourceSets.main.resources.srcDir '../shared-1.21.1/src/main/resources'
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}
processResources {
    inputs.property 'version', project.version
    filesMatching(['fabric.mod.json', 'META-INF/mods.toml', 'META-INF/neoforge.mods.toml']) { expand version: project.version }
}
tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}
tasks.register('coreRegression', JavaExec) {
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(21) }
    workingDir = file('../shared-1.21.1')
    mainClass = '../tools/RegressionChecks.java'
    args 'shared'
}
tasks.named('check').configure { dependsOn 'coreRegression' }
tasks.register('runtimeContracts', JavaExec) {
    dependsOn 'classes'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = '../tools/Minecraft121Checks.java'
}
tasks.named('check').configure { dependsOn 'runtimeContracts' }
tasks.register('screenRenderContracts', JavaExec) {
    dependsOn 'classes'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = '../tools/ScreenRenderChecks.java'
    args '1.21.1'
}
tasks.named('check').configure { dependsOn 'screenRenderContracts' }
