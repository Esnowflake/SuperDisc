name: CI
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
env:
  GRADLE_USER_HOME: ${{ github.workspace }}/.gradle-home
jobs:
  matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      targets: ${{ steps.matrix.outputs.targets }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - id: matrix
        run: echo "targets=$(python scripts/release.py matrix)" >> "$GITHUB_OUTPUT"
      - run: python -m unittest discover -s scripts -p 'test_*.py' -v
  build:
    needs: matrix
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix.outputs.targets) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Full Build
        run: |
          mkdir -p "$GITHUB_WORKSPACE/.tmp"
          export JAVA_TOOL_OPTIONS="-Djava.io.tmpdir=$GITHUB_WORKSPACE/.tmp"
          bash "${{ matrix.wrapper }}" --project-dir "${{ matrix.project }}" --no-daemon clean build
      - name: Verify Installable JAR
        run: |
          VERSION=$(sed -n 's/^mod_version=//p' gradle.properties | tr -d '\r')
          python scripts/release.py prepare "v$VERSION" --target "${{ matrix.id }}" --output "release/ci/${{ matrix.id }}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: checked-${{ matrix.id }}-${{ github.sha }}
          path: release/ci/${{ matrix.id }}/*
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: diagnostics-${{ matrix.id }}-${{ github.sha }}
          path: |
            ${{ matrix.project }}/build/reports/
            .gradle-home/daemon/*/*.log
          if-no-files-found: warn
