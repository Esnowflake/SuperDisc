name: CI
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
env:
  GRADLE_USER_HOME: ${{ github.workspace }}/.gradle-home
jobs:
  matrix:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      targets: ${{ steps.matrix.outputs.targets }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - id: matrix
        run: echo "targets=$(python scripts/release.py matrix)" >> "$GITHUB_OUTPUT"
      - run: python -m unittest discover -s scripts -p 'test_*.py' -v
  build:
    name: Build ${{ matrix.id }}
    needs: matrix
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix.outputs.targets) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Full Build
        run: |
          mkdir -p "$GITHUB_WORKSPACE/.tmp"
          export JAVA_TOOL_OPTIONS="-Djava.io.tmpdir=$GITHUB_WORKSPACE/.tmp"
          bash "${{ matrix.wrapper }}" --project-dir "${{ matrix.project }}" --no-daemon clean build
      - name: Verify Installable JAR
        run: |
          VERSION=$(sed -n 's/^mod_version=//p' gradle.properties | tr -d '\r')
          python scripts/release.py prepare "v$VERSION" --target "${{ matrix.id }}" --output "release/ci/${{ matrix.id }}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: checked-${{ matrix.id }}-${{ github.sha }}
          path: release/ci/${{ matrix.id }}/*
          if-no-files-found: error
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: diagnostics-${{ matrix.id }}-${{ github.sha }}
          path: |
            ${{ matrix.project }}/build/reports/
            .gradle-home/daemon/*/*.log
          if-no-files-found: warn
