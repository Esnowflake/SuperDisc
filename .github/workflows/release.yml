name: Draft Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: draft-${{ github.ref }}
  cancel-in-progress: false
env:
  GRADLE_USER_HOME: ${{ github.workspace }}/.gradle-home
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      targets: ${{ steps.matrix.outputs.targets }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Validate Tag And Main Ancestry
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          git fetch origin main
          git merge-base --is-ancestor HEAD origin/main
          python scripts/release.py validate "$RELEASE_TAG"
          python -m unittest discover -s scripts -p 'test_*.py' -v
      - id: matrix
        run: echo "targets=$(python scripts/release.py matrix)" >> "$GITHUB_OUTPUT"
  build:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.validate.outputs.targets) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Build Tag And Verify Bundle
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          mkdir -p "$GITHUB_WORKSPACE/.tmp"
          export JAVA_TOOL_OPTIONS="-Djava.io.tmpdir=$GITHUB_WORKSPACE/.tmp"
          bash "${{ matrix.wrapper }}" --project-dir "${{ matrix.project }}" --no-daemon clean build
          python scripts/release.py prepare "$RELEASE_TAG" --target "${{ matrix.id }}" --output "release/bundle"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bundle-${{ matrix.id }}
          path: release/bundle/*
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: diagnostics-${{ matrix.id }}
          path: |
            ${{ matrix.project }}/build/reports/
            .gradle-home/daemon/*/*.log
          if-no-files-found: warn
  assemble:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: bundle-*
          path: release/inputs
      - env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python scripts/release.py assemble "$RELEASE_TAG" --inputs release/inputs --output release/final
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-verified
          path: release/final/*
          if-no-files-found: error
  publish:
    needs: assemble
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-verified
          path: release/final
      - name: Create Or Complete Draft
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: python scripts/publish.py "$RELEASE_TAG" release/final --repo "$GITHUB_REPOSITORY"
