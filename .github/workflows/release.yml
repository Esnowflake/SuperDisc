name: Draft Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: draft-${{ github.ref }}
  cancel-in-progress: false
env:
  GRADLE_USER_HOME: ${{ github.workspace }}/.gradle-home
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      targets: ${{ steps.matrix.outputs.targets }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Validate Tag And Main Ancestry
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          git fetch origin main
          git merge-base --is-ancestor HEAD origin/main
          python scripts/release.py validate "$RELEASE_TAG"
          python -m unittest discover -s scripts -p 'test_*.py' -v
      - id: matrix
        run: echo "targets=$(python scripts/release.py matrix)" >> "$GITHUB_OUTPUT"
  build:
    name: Build ${{ matrix.id }}
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.validate.outputs.targets) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Build Tag And Verify Bundle
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          mkdir -p "$GITHUB_WORKSPACE/.tmp"
          export JAVA_TOOL_OPTIONS="-Djava.io.tmpdir=$GITHUB_WORKSPACE/.tmp"
          bash "${{ matrix.wrapper }}" --project-dir "${{ matrix.project }}" --no-daemon clean build
          python scripts/release.py prepare "$RELEASE_TAG" --target "${{ matrix.id }}" --output "release/bundle"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bundle-${{ matrix.id }}
          path: release/bundle/*
          if-no-files-found: error
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: diagnostics-${{ matrix.id }}
          path: |
            ${{ matrix.project }}/build/reports/
            .gradle-home/daemon/*/*.log
          if-no-files-found: warn
  assemble:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: bundle-*
          path: release/inputs
      - env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python scripts/release.py assemble "$RELEASE_TAG" --inputs release/inputs --output release/final
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-verified
          path: release/final/*
          if-no-files-found: error
  publish:
    needs: assemble
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-verified
          path: release/final
      - name: Create Or Complete Draft
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: python scripts/publish.py "$RELEASE_TAG" release/final --repo "$GITHUB_REPOSITORY"
