plugins { id 'net.minecraftforge.gradle' version '6.0.54' }
apply from: '../gradle/common-1.21.1.gradle'
base { archivesName = 'super-disc-forge-1.21.1' }
jarJar.enable()
minecraft { mappings channel: 'official', version: '1.21.1' }
dependencies {
    minecraft 'net.minecraftforge:forge:1.21.1-52.1.16'
    implementation 'javazoom:jlayer:1.0.1'
    jarJar('javazoom:jlayer:[1.0.1,1.0.2)')
}
tasks.named('build').configure { dependsOn 'jarJar' }
